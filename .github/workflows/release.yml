name: Weekly binaries

on:
  push:
    paths:
      - "agent/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: "latest"
          package-manager-cache: false
      - name: Install latest dependencies
        run: bun install --no-save --no-cache
      - name: Build
        run: bun run build
      - name: Test standalone binary
        run: bun run vitest run tests/cli/cli.test.ts tests/rpc
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          binary=opi
          if [[ "$TARGET" == windows-* ]]; then
            binary=opi.exe
          fi
          tar -cf - -C dist "$binary" -C "$GITHUB_WORKSPACE" LICENSE |
            gzip -9 > "artifacts/opi-${TARGET}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: opi-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Recreate rolling release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: rolling
    defaults:
      run:
        shell: bash
        working-directory: artifacts
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: opi-*
          path: artifacts
          merge-multiple: true
      - name: Prepare versioned assets
        id: assets
        run: |
          BUILD_ID="build-$(date -u +%Y%m%d)"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          for archive in opi-*.tar.gz; do
            mv "$archive" "${archive/opi-/opi-${BUILD_ID}-}"
          done
          sha256sum opi-*.tar.gz > "SHA256SUMS-${BUILD_ID}"
          cat > "${BUILD_ID}.md" <<EOF
          构建号：${BUILD_ID}

          源码：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          构建：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}

          使用构建时最新的官方 Bun 和依赖。支持 Linux x64、macOS ARM64 和 Windows x64。
          下载 opi-${BUILD_ID}-<平台>.tar.gz，解压后将 opi（Windows 为 opi.exe）放入 PATH，无需安装 Bun 或 Node.js。
          校验文件：SHA256SUMS-${BUILD_ID}。
          EOF
      - name: Delete existing rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")
          if [[ -n "$release_id" ]]; then
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" \
              --jq ".[] | select(.ref == \"refs/tags/${RELEASE_TAG}\") | .ref")
            if [[ -n "$tag" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
            fi
          fi
      - name: Create rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Rolling builds
          target_commitish: ${{ github.sha }}
          body_path: artifacts/${{ steps.assets.outputs.build_id }}.md
          files: |
            artifacts/opi-${{ steps.assets.outputs.build_id }}-*.tar.gz
            artifacts/SHA256SUMS-${{ steps.assets.outputs.build_id }}
            artifacts/${{ steps.assets.outputs.build_id }}.md
          fail_on_unmatched_files: true
          make_latest: "true"
