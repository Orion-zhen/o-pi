name: GUI builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "agent/**"
      - "scripts/**"
      - "tests/gui/**"
      - "package.json"
      - "vite.gui.config.ts"
      - "playwright.gui.config.ts"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          package-manager-cache: false
      - run: bun install --no-save
      - run: bun run typecheck
      - run: ./node_modules/.bin/vitest run tests/gui
      - run: bun run build:web
      - run: bun run build:desktop
      - if: runner.os == 'Linux'
        run: xvfb-run -a ./node_modules/.bin/playwright test --config playwright.gui.config.ts
      - uses: actions/upload-artifact@v7
        with:
          name: opi-gui-${{ matrix.target }}
          path: |
            dist/opi-web
            dist/opi-web.exe
            dist/desktop/release/*.AppImage
            dist/desktop/release/*.dmg
            dist/desktop/release/*.exe
          if-no-files-found: error
          compression-level: 0
